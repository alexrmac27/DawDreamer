name: Master Build - Coldpiano VST3 + DawDreamer (Windows)

on:
  push:
    branches: [main, master, piano]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-package:
    runs-on: windows-latest

    steps:
      - name: Checkout DawDreamer Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout Coldpiano
        uses: actions/checkout@v7
        with:
          repository: alexrmac27/juce
          # The Coldpiano compatibility patch is based on this revision.
          ref: 16625e49bad1e356b01f738b388a10df13a3836e
          token: ${{ secrets.COLDPIANO_REPO_TOKEN || github.token }}
          path: external/juce-coldpiano

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install Python Build and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build delvewheel numpy scipy pytest

      - name: Build Coldpiano VST3
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git -C external/juce-coldpiano apply --ignore-space-change "$env:GITHUB_WORKSPACE/.github/patches/coldpiano-juce.patch"
          $repoPath = "external/juce-coldpiano/ColdPiano_Phase8_Complete/ColdPiano_Phase8"
          $jucerFile = Get-ChildItem -Path $repoPath -Filter "*.jucer" -File -Recurse |
            Select-Object -First 1

          if (Test-Path (Join-Path $repoPath "CMakeLists.txt")) {
            cmake -S $repoPath -B build-coldpiano -A x64 -DCMAKE_BUILD_TYPE=Release
            cmake --build build-coldpiano --config Release --target ColdPiano_VST3
          } elseif ($null -ne $jucerFile) {
            $projucerCmake = Join-Path $repoPath "extras/Projucer/Builds/CMake"
            cmake -S $projucerCmake -B build-projucer -A x64 -DCMAKE_BUILD_TYPE=Release
            cmake --build build-projucer --config Release

            $projucerExe = Get-ChildItem -Path build-projucer -Filter "Projucer.exe" -File -Recurse |
              Select-Object -First 1
            if ($null -eq $projucerExe) {
              throw "Projucer.exe was not produced."
            }
            & $projucerExe.FullName --resave $jucerFile.FullName

            $slnFile = Get-ChildItem -Path $jucerFile.DirectoryName -Filter "*.sln" -File -Recurse |
              Select-Object -First 1
            if ($null -eq $slnFile) {
              throw "No Visual Studio solution was generated for $($jucerFile.FullName)."
            }
            msbuild $slnFile.FullName /p:Configuration=Release /p:Platform=x64 /m
          } else {
            throw "No CMakeLists.txt or Projucer project was found in $repoPath."
          }

          $vst3Bundle = Get-ChildItem -Path $repoPath, build-coldpiano, build-projucer `
            -Filter "Cold Piano.vst3" -Directory -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $vst3Bundle) {
            throw "Failed to locate the compiled Coldpiano .vst3 bundle."
          }

          New-Item -ItemType Directory -Force -Path staged_vst3 | Out-Null
          Copy-Item -Path $vst3Bundle.FullName `
            -Destination "$env:GITHUB_WORKSPACE/staged_vst3/$($vst3Bundle.Name)" `
            -Recurse -Force

      - name: Validate Coldpiano with pluginval
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" `
            -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval_bin -Force
          New-Item -ItemType Directory -Force -Path pluginval_logs | Out-Null

          $pluginval = Get-ChildItem -Path pluginval_bin -Filter pluginval.exe -File -Recurse |
            Select-Object -First 1
          if ($null -eq $pluginval) {
            throw "pluginval.exe was not found in the downloaded archive."
          }

          & $pluginval.FullName `
            --strictness-level 8 `
            --validate-in-process `
            --skip-gui-tests `
            --timeout-ms 60000 `
            --output-dir pluginval_logs `
            "$env:GITHUB_WORKSPACE/staged_vst3/Cold Piano.vst3"

      - name: Build DawDreamer Wheel
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item -Recurse -Force dawdreamer/faustlibraries/.git `
            -ErrorAction SilentlyContinue
          Set-Location thirdparty/libfaust
          python download_libfaust.py
          Set-Location ../libsamplerate
          cmake -DCMAKE_BUILD_TYPE=Release -B build_release
          cmake --build build_release --config Release
          Set-Location ../..

          $env:PYTHONMAJOR = "3.11"
          $env:pythonLocation = (python -c "import sys; print(sys.prefix)")
          msbuild Builds/VisualStudio2022/DawDreamer.sln /property:Configuration=Release

          New-Item -ItemType Directory -Force -Path dist_raw, dist | Out-Null
          python -m build --wheel --outdir dist_raw

          $wheel = Get-ChildItem -Path dist_raw -Filter "*.whl" -File |
            Select-Object -First 1
          if ($null -eq $wheel) {
            throw "DawDreamer wheel was not built."
          }
          delvewheel repair $wheel.FullName -w dist `
            --add-path "thirdparty/libfaust/win64/Release/lib;thirdparty/libsamplerate/build_release/src/Release;Builds/VisualStudio2022/x64/Release/Dynamic Library"

          if (-not (Get-ChildItem -Path dist -Filter "*.whl" -File)) {
            Copy-Item -Path $wheel.FullName -Destination dist
          }

      - name: Install Wheel and Run Coldpiano Render Test
        shell: pwsh
        env:
          COLDPIANO_VST3_PATH: ${{ github.workspace }}\staged_vst3\Cold Piano.vst3
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --force-reinstall --no-index --no-deps --find-links=dist dawdreamer
          python -m pip install scipy pytest
          Push-Location $env:RUNNER_TEMP
          try {
            python -m pytest "$env:GITHUB_WORKSPACE/tests/test_coldpiano_integration.py" -v -s
          } finally {
            Pop-Location
          }

      - name: Upload Windows Release Bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Coldpiano-DawDreamer-Windows-Release
          path: |
            staged_vst3/Cold Piano.vst3/**
            dist/*.whl
            tests/coldpiano_test_render.wav
            pluginval_logs/**
